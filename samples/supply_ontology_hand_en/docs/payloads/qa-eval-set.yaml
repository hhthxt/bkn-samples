# supply_ontology_hand 业务问答测试集（机器可读）
# 题干必须是业务口吻；参数名只出现在 reference
# 人读版：../业务问答测试集.md

knowledge_network_id: supply_ontology_hand
snapshot_date: "2026-08-13"
data_dir: ../../data

anchors:
  product: "382-000005"
  product_name: 北斗导航农机驾驶仪
  demand_end: "2026-05-14"
  demand_end_source: "sales_order SO0000002 promised_delivery_date"
  production_warehouses:
    - 苏州半成品仓
    - 苏州成品仓
    - 苏州电子原料仓
    - 苏州无人机原料仓
    - 苏州装配原料仓
    - 乌鲁木齐成品仓
    - 哈尔滨成品仓
  finished_goods_warehouses:
    - 苏州成品仓
    - 乌鲁木齐成品仓
    - 哈尔滨成品仓

snapshot:
  product_count: 30
  material_count: 3497
  material_purchased: 3149
  material_make: 233
  material_subcontract: 114
  supplier_count: 230
  purchaser_yang: 51
  salesorder_count: 800
  salesorder_382: 40
  warehouse_distinct: 29
  forecast_open_count: 87
  forecast_qty_all: 106422
  forecast_qty_open: 46840
  forecast_382_open_qty: 2605
  forecast_382_open_n: 6
  inv_382_fg: 534
  inv_382_all: 816
  inv_791_000013_prod: 1000
  inv_791_000007_prod: 0
  inv_791_000015_prod: 0
  inv_u00_000151_fg: 3800
  inv_734_000001_fg: 1
  inv_suzhou_fg: 9250
  bom_382_rows_incl_root: 507
  bom_382_l1_main: 9
  bom_382_main_rows: 313
  bom_382_main_unique: 272
  bom_382_max_level: 5
  bom_382_p61_main_unique_intersect: 28
  bom_382_p61_u00_main_unique_intersect: 11

metrics:
  - name: 产品总数
    cases:
      - { id: M-PROD-01, question: 我们现在有多少种成品？, reference: { snapshot_value: 30 } }
      - { id: M-PROD-03, question: 成品料号有多少种？先别管仓库里有没有货。, forbid_route: [inventory] }
      - { id: M-PROD-04, question: 成品种类和物料种类差多少？, reference: { product: 30, material: 3497 } }
      - { id: M-PROD-05, question: 自动驾驶这条产品线有多少种成品？, reference: { answer: 产品对象无产品线字段，须声明缺口 } }
  - name: 物料总数
    cases:
      - { id: M-MAT-01, question: 物料主数据有多少颗料？, reference: { snapshot_value: 3497 } }
      - { id: M-MAT-02, question: 外购物料有多少种？, reference: { snapshot_value: 3149, filter: materialattr==外购 } }
      - { id: M-MAT-03, question: 自制件有多少种？, reference: { snapshot_value: 233 } }
      - { id: M-MAT-04, question: 委外件有多少种？, reference: { snapshot_value: 114 } }
      - { id: M-MAT-06, question: 仓库里实际有货的料有多少种？, route: not_this_metric }
  - name: 供应商总数
    cases:
      - { id: M-SUP-01, question: 供应商主数据有多少家？, reference: { snapshot_value: 230 } }
      - { id: M-SUP-04, question: 采购员杨强云名下有多少家供应商？, reference: { snapshot_value: 51 } }
  - name: 销售订单数
    cases:
      - { id: M-SO-01, question: 销售订单一共多少张？, reference: { snapshot_value: 800 } }
      - { id: M-SO-02, question: 产品 382-000005 有多少张订单？, reference: { snapshot_value: 40 } }
      - { id: M-SO-06, question: 销售订单一共多少张？先不要做交期分析。, forbid_route: [skill_s1] }
  - name: 仓库数
    cases:
      - { id: M-WH-01, question: 库存里一共出现过多少个仓库？, reference: { snapshot_value: 29 } }
      - { id: M-WH-03, question: 生产能用的仓库有几个、是哪几个？, reference: { count: 7, names: production_warehouses } }
      - { id: M-WH-06, question: 一共有多少库存数量？, route: inventory_available_qty }
  - name: 库存可用量
    cases:
      - { id: M-INV-03, question: 382-000005 成品在成品仓里有多少？, reference: { snapshot_value: 534, scope: finished_goods } }
      - { id: M-INV-02, question: 物料 791-000013 生产上能用多少？, reference: { snapshot_value: 1000 } }
      - { id: M-INV-04, question: 382-000005 把借用仓也算上有多少？, reference: { snapshot_value: 816, scope: all } }
      - { id: M-INV-05, question: 苏州成品仓里有多少可用库存？, reference: { snapshot_value: 9250 } }
      - { id: M-INV-10, question: 734-000001 成品仓还有多少？, reference: { snapshot_value: 1, forbid_route: [skill_s2_as_final] } }
  - name: 预测需求量合计
    cases:
      - { id: M-FC-03, question: 产品 382-000005 预测需求多少？, reference: { all: 11300, open: 2605 } }
      - { id: M-FC-05, question: 382 预测是两千多，那 5 月 14 日一定能齐套吗？, reference: { answer: 不能；齐套走倒排 } }
  - name: 未关闭预测单数
    cases:
      - { id: M-FCO-01, question: 还有多少张未关闭的预测单？, reference: { snapshot_value: 87 } }
      - { id: M-FCO-04, question: 382-000005 还有几张未关闭预测？, reference: { snapshot_value: 6 } }

functions:
  - id: warehouse_scope_resolve
    cases:
      - { id: F-WSR-01, question: 做生产齐套时，哪些仓库的库存能算进去？, reference: { count: 7 } }
      - { id: F-WSR-02, question: 看成品能不能发出去，应该看哪几个仓？, reference: { count: 3, names: finished_goods_warehouses } }
      - { id: F-WSR-06, question: 问现在最多能卖多少和齐套缺不缺料，仓是不是同一套？, reference: { answer: 不是；可售成品部分3仓；齐套/可产7仓 } }
  - id: material_leadtime_days
    cases:
      - { id: F-LT-01, question: 外购件 606-000989 标准采购交期几天？, reference: { snapshot_value: 14 } }
      - { id: F-LT-02, question: 成品 382-000005 生产要做几天？, reference: { snapshot_value: 1 } }
      - { id: F-LT-03, question: 994-000550 这根连接线采购交期几天？, reference: { snapshot_value: 35 } }
  - id: po_pr_open_qty
    cases:
      - { id: F-OPQ-06, question: 齐套里说的在途按什么算？, reference: { answer: 未关闭PO未清汇总 } }
      - { id: F-OPQ-07, question: 问现在最多能卖多少时，在途PO加不加？, reference: { answer: 不加 } }
  - id: bom_structure_list
    cases:
      - { id: F-BOML-01, question: 把 382-000005 的物料清单给我，先不要库存。, reference: { route: fn_bom_list, not_inventory: true, l1_main_count: 9, l1_main: [791-000013, 606-000989, 606-000990, 528-000036, 791-000007, 994-000550, 468-000493, 468-000530, 791-000015] } }
      - { id: F-BOML-02, question: 382 的 BOM 一共有多少行、多少颗不同子件？, reference: { route: fn_bom_list, not_metric: true, rows_incl_root: 507, main_rows: 313, unique_main: 272, max_level: 5 } }
      - { id: F-BOML-05, question: 还没说是哪颗成品，BOM 有多少行？, reference: { cannot_compute: true } }
  - id: bom_shared_structure
    cases:
      - { id: F-BOMSH-01, question: 382-000005 和 P61-000351 的 BOM 上有哪些相同的料？先不要看够不够。, reference: { route: fn_bom_shared_list, min_products: 2, not_s3: true, not_contention: true, shared_unique_main: 28 } }
      - { id: F-BOMSH-02, question: 382、P61-000351、U00-000151 三款 BOM 上共同有哪些料？, reference: { route: fn_bom_shared_list, min_products: 2, require_all_products_intersect: true, not_pairwise_union: true, shared_unique_main: 11 } }
      - { id: F-BOMSH-03, question: 只要一个产品，共用料有哪些？, reference: { cannot_compute: true, min_products: 2 } }
  - id: bom_level_inventory
    cases:
      - { id: F-BOMINV-01, question: 把 382-000005 一层子件展开，各颗现在有多少可用？, reference: { route: fn_bom_level_inventory, not_s1: true, expect: { "791-000013": 1000, "791-000007": 0, "791-000015": 0 } } }
      - { id: F-BOMINV-02, question: 791-000013 生产上能用多少？, reference: { snapshot_value: 1000, must_match_metric: true } }
      - { id: F-BOMINV-04, question: 382 各层子件的占用也列出来，判断时要不要先扣掉？, reference: { show_reserved: true, subtract_reserved: false } }
      - { id: F-BOMINV-06, question: 在途的货算不算现在可用库存？, reference: { answer: 不算 } }
  - id: substitute_status
    cases:
      - { id: F-ALT-01, question: 382-000005 有没有替代料？, reference: { has_alt_groups: true, approx_groups: 70, not_s2: true } }
      - { id: F-ALT-03, question: 客户没说能不能用替代料，先把替代库存加进可售里？, reference: { must_ask: substitute_enabled } }
      - { id: F-ALT-05, question: 两颗替代料都有货，能供套数是加起来还是只算多的那颗？, reference: { must_ask: substitute_enabled, within_group: max } }
  - id: theoretical_build
    cases:
      - { id: F-THB-01, question: 382 不算成品仓库存，现有子料还能做多少套？, reference: { route: fn_theoretical_build, include_fg: false, include_in_transit: false, not_s2: true } }
      - { id: F-THB-04, question: 还能做多少，和现在能卖多少，是同一个数吗？, reference: { answer: 不是；可售=理论可产+成品库存 } }
  - id: kitting_net_demand
    cases:
      - { id: F-KIT-01, question: 382-000005 要 50 套，一层子料齐不齐？缺在哪？, reference: { route: fn_kitting_net_demand, not_s1: true, include_in_transit: true, expect_gap_parts: [791-000007, 791-000015] } }
      - { id: F-KIT-02, question: 要 50 套齐不齐时，在途 PO 算不算？, reference: { include_in_transit: true } }
      - { id: F-KIT-05, question: 要 50 套齐不齐，和 5 月 14 日能不能交货，是一回事吗？, reference: { answer: 不是；无日期=净需求函数；有日期=S1 } }
  - id: max_build_without_po
    cases:
      - { id: F-BLD-01, question: 382-000005 用现有原材料还能组装多少套？, reference: { route: fn_theoretical_build, alias: max_build_without_po, deduct_fg_again: false, include_in_transit: false, not_s1: true, not_s2: true } }
      - { id: F-BLD-02, question: 成品仓里已经有 534 台，可组装还要不要再减 534？, reference: { deduct_fg_again: false } }
      - { id: F-BLD-03, question: 这个数是不是就是现在最多能卖的数？, reference: { answer: 不是；可售=理论可产+成品库存 } }
  - id: shared_material_contention
    cases:
      - { id: F-SHR-01, question: 有一颗料两个父件都要用，两边都要生产，够不够？, reference: { route: fn_shared_material, include_in_transit: true } }
      - { id: F-SHR-04, question: 共用料判断时在途算不算？, reference: { include_in_transit: true } }
  - id: three_set_formulas
    cases:
      - { id: F-SET-01, question: 382 成品仓有货，是不是就能承诺卖 50 套？还是要看齐套？, reference: { answer: 可售≠净需求≠S1 } }
      - { id: F-SET-02, question: 用现有料还能做几套，和现在最多能卖多少，哪个大？, reference: { answer: 可售≥理论可产/可组装 } }

skills:
  - id: production-schedule-backward-planning
    scene: S1
    cases:
      - id: S1-01
        question: 产品 382-000005 要在 2026-05-14 交货，能不能齐套？帮我倒排。
        input: { product_query: "382-000005", demand_end: "2026-05-14", warehouse_scope: production_available }
        reference:
          must_include: [can_deliver_on_time, delay_a, delay_b, supply_status_10, markdown_report, warehouse_scope]
          include_in_transit: true
          expect_zero_avail: ["791-000007", "791-000015"]
          forecast_not_conclusion: 2605
      - id: S1-06
        question: 倒排完直接给缺料下采购订单。
        reference: { refuse_auto_po: true }
      - id: S1-07
        question: 382 齐套怎么样？截止日期我还没定。
        reference: { must_ask: demand_end, no_kitting_conclusion: true }
      - id: S1-09
        question: 382 未关闭预测需求多少？先不要做齐套。
        route: metric_forecast_qty
        reference: { snapshot_value: 2605, not_s1: true }
      - id: S1-11
        question: 382 要 50 套，子料齐不齐？（没给哪天交）
        route: fn_kitting_net_demand
        reference: { not_s1: true }
      - id: S1-SS-09
        question: 还没给交货日，这颗料供应正不正常？
        reference: { status: unknown, not_type1_function: true }
  - id: demand-fulfillment-capacity-analysis
    scene: S2
    cases:
      - { id: S2-01, question: U00-000151 现在最多能卖多少？, reference: { must_ask_substitute: true, fg_snapshot: 3800, include_in_transit: false, not_delivery_promise: true } }
      - { id: S2-05, question: 客户问 734-000001 现在能承诺多少，替代料他没提。, reference: { must_ask_substitute: true, fg_snapshot: 1, forbid_promise: 20 } }
      - { id: S2-06, question: 382 成品仓有 534 台，所以最多能卖 534？, reference: { answer: 不对；可售=成品库存+理论可产；不加在途 } }
      - { id: S2-09, question: 算可售时把在途 PO 也加上。, reference: { include_in_transit: false } }
      - { id: S2-10, question: 用现有料能组装多少，是不是就是可售？, reference: { answer: 不是 } }
  - id: demand-fulfillment-requirement-coverage-analysis
    scene: S3
    cases:
      - id: S3-01
        question: 新加两单：382-000005 再要 50、P61-000351 要 60，能不能接？替代料先不用。
        input:
          substitute_enabled: false
          demands:
            - { product_query: "382-000005", demand_qty: 50 }
            - { product_query: "P61-000351", demand_qty: 60 }
        reference: { in_transit_in_pool: true, markdown_report: true }
      - { id: S3-04, question: 382 现在最多能卖多少？, route: skill_s2 }
      - { id: S3-09, question: 这两单覆盖分析，在途 PO 算不算共享池？, reference: { in_transit_in_pool: true } }
      - { id: S3-10, question: 先不要看互抢，只问 382 现在能卖多少。, route: skill_s2 }

routing_traps:
  - { id: R-01, question: 有多少种成品？, route: 产品总数, expected: 30 }
  - { id: R-04, question: 把 382 的物料清单给我，先不要库存。, route: fn_bom_list }
  - { id: R-05, question: 382 和 P61 的 BOM 上有哪些相同的料？数量还没定。, route: fn_bom_shared_list }
  - { id: R-05a, question: 382、P61、U00 三款 BOM 共同有哪些料？, route: fn_bom_shared_list }
  - { id: R-05b, question: 把 382 一层子件展开，各有多少可用？, route: fn_bom_level_inventory }
  - { id: R-05c, question: 382 有没有替代料？替代有没有货？, route: fn_substitute_status }
  - { id: R-06, question: 382 要 50 套，子料齐不齐？（没给日期）, route: fn_kitting_net_demand }
  - { id: R-07, question: 382 按 5 月 14 日能不能齐套？, route: S1 }
  - { id: R-08, question: U00-000151 现在最多卖多少？, route: S2 }
  - { id: R-08b, question: 382 不算成品库存，还能做多少套？, route: fn_theoretical_build }
  - { id: R-09, question: 现有料能组装多少套？, route: fn_theoretical_build }
  - { id: R-10, question: 新加两单需求能不能接？, route: S3 }
  - { id: R-11, question: 还有多少张预测没关？, route: 未关闭预测单数, expected: 87 }
  - { id: R-12, question: 382 齐套怎么样？没给截止日期, route: ask_demand_end }
  - { id: R-13, question: 帮我下采购订单, route: 拒绝自动 }

forbidden:
  - 引用 supplychain_hd0202 规模（431 / 14283）或仓名（昆山 / 新疆）
  - 用 run_sql 重算已建模指标
  - 把理论可产 / 合计可售 / 齐套净需求合成一个「可供套数」
  - 按 SKU 新建「BOM 行数」指标
  - 多款 BOM 结构交直接当成 S3 / 争用（数量未定）
  - 三款共用清单用两两交集再合并，而不是全部产品同时交
  - 可组装再减一次成品库存
  - 替代组用 SUM 冒充本包口径（本包为 MAX）
  - 无交货日却给出 10 档供应状态或 S1 齐套结论
  - 自动执行 supply_ontology_hand_act_po
