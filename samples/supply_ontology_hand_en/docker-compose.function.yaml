services:
  supply-function:
    build:
      context: .
      dockerfile: Dockerfile.function
    image: supply-ontology-hand-function:local
    restart: unless-stopped
    ports:
      - "${SUPPLY_FN_BIND_PORT:-8765}:8765"
    environment:
      SUPPLY_FN_HOST: "0.0.0.0"
      SUPPLY_FN_PORT: "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
