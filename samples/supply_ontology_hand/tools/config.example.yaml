openbkn:
  # 步骤 5 绑定脚本使用；OpenBKN 认证见 openbkn auth login
  kn_id: supply_ontology_hand
  kn_name: 供应链本体知识网络-手工版

function:
  # 必须是 OpenBKN/POC 平台网络可解析、可访问的 URL；不要填写 host.docker.internal
  service_url: ""

database:
  engine: postgres   # postgres | mysql（MySQL 时 port 通常为 3306）
  host: 127.0.0.1
  port: 5432         # mysql 默认 3306
  database: supply_demo_hand   # 目标库名（可改）；须预先 CREATE DATABASE，脚本不建库
  user: supply_demo
  password: change_me   # 必填（可为空串但 OpenBKN 连接器不接受 omit）；Docker 网段连库通常须设真实密码
  schema: public     # 仅 PostgreSQL；MySQL 可忽略

load:
  sample_dir: ../data
  mode: recreate     # recreate：DROP+重建 12 张体验表（覆盖同名表，无确认）；append_if_empty 暂未实现
  on_error: stop     # stop | continue

vega:
  catalog_id: ""     # 步骤 4 扫描后由 setup_catalog.py --write-config 写入，或手工填写
  catalog_name: supply-demo-hand   # 步骤 4 脚本创建的 Catalog 名称（可改）
  catalog_host: host.docker.internal   # OpenBKN 访问宿主机 DB 时使用；本机灌库仍用 database.host
  connector_type: postgresql   # 默认同 database.engine（postgres→postgresql）
  connector_options:
    sslmode: disable

bind:
  dry_run: false
