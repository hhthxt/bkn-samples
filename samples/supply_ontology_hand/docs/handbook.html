<h1>供应链本体场景示例</h1>
<p>本 sample 用一次性流程演示知识网络导入、数据绑定、指标、Skill、函数、Action 与 Agent 验证。</p>
<h2>核心业务问题</h2>
<p>判断产品 U00-000080 是否能在指定截止日前交付指定数量，并给出库存、BOM、生产能力和采购证据。</p>
<h2>两种操作模式</h2>
<ul><li>Agent 模式：通过自然语言触发查询、计算和受控行动。</li><li>手工模式：通过 CLI/API 显式执行导入、绑定、查询和验证。</li></ul>
<h2>验证边界</h2>
<p>预测案例以 2026-08-15 为 benchmark 基准日；历史案例只用于回归测试。Action 默认 dry-run，必须人工确认后才执行。</p>
